default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: casita_development
  username: <%= ENV.fetch("DB_USERNAME") { 'postgres' } %>
  password: <%= ENV.fetch("DB_PASSWORD") { 'postgres' } %>
  host: localhost

test:
  <<: *default
  database: casita_test

production:
  primary: &primary_production
    <<: *default
    database: casita_production
    username: casita
    password: <%= ENV["CASITA_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: casita_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: casita_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: casita_production_cable
    migrations_paths: db/cable_migrate
